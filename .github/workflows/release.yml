name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # A macOS runner because the build needs cgo for the host's own platform:
    # see docs/releasing.md. arm64, matching the one target.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: shuttle
          fetch-depth: 0

      # The weftremote and sandbox tests read weft's docs/service-v2 from a weft
      # checkout beside shuttle's (internal/weftfixtures), and fail without it.
      # A sibling rather than a subdirectory keeps shuttle's tree clean for
      # GoReleaser. weft is private, so this takes a read-only token on it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: EnderRealm/weft
          path: weft
          token: ${{ secrets.WEFT_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: shuttle/go.mod
          cache-dependency-path: shuttle/go.sum

      - name: Test
        working-directory: shuttle
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
          workdir: shuttle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
