version: 2

project_name: shuttle

builds:
  - binary: shuttle
    main: ./cmd/shuttle
    # cgo reaches proc_pidpath in internal/reap, so a release is built on the
    # platform it runs on and never cross-compiled. Dropping cgo would still
    # build; the release tag and the post hook are what fail instead.
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    tags:
      - release
    ldflags:
      - -s -w -X shuttle/internal/version.Current={{ .Tag }}
    hooks:
      post:
        - cmd: sh scripts/verify-release-binary.sh "{{ .Path }}" "{{ .Tag }}"
          output: true

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./release/manifest.json

release:
  extra_files:
    - glob: ./release/manifest.json

changelog:
  use: github-native
